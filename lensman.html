let currentSpeed = 168;

let audioInitialized = false;

// Cintillos de los tubos: el movimiento lo maneja JS con un reloj global.
// El typewriter re-crea el DOM con innerHTML en cada letra, y eso reiniciaría
// una animación CSS (por eso los letreros no corrían hasta terminar la
// animación completa). Con un reloj global, la posición se calcula desde el
// tiempo total y no se pierde aunque el span se vuelva a crear.
// El texto va repetido dentro del span y el bucle es continuo: se desplaza
// una copia y vuelve al inicio sin hueco, así el tubo nunca se queda vacío.
// Con las letras espaciadas cada copia es más ancha, así que hacen falta
// menos repeticiones para llenar el tubo. La velocidad es lenta.
const MARQUEE_SPEED = 30; // píxeles por segundo, lento para leerse
let marqueeStartTime = null;
function repeatMarqueeText(text, times, sep) {
  sep = sep || ' \u2022 ';
  let out = '';
  for (let k = 0; k < times; k++) out += text + sep;
  return out;
}
function updateMarquees(now) {
  if (marqueeStartTime === null) marqueeStartTime = now;
  const elapsed = (now - marqueeStartTime) / 1000; // segundos
  document.querySelectorAll('.tube-marquee').forEach(marquee => {
    const span = marquee.querySelector('span');
    if (!span) return;
    const times = parseInt(span.dataset.times || '3', 10);
    const totalWidth = span.scrollWidth;
    if (!totalWidth || !times) return;
    const unitWidth = totalWidth / times;
    // x va de 0 a -unitWidth y se reinicia; como el contenido se repite cada
    // unidad, el salto es invisible y el tubo siempre queda lleno.
    let x = -(elapsed * MARQUEE_SPEED) % unitWidth;
    span.style.transform = 'translateX(' + x + 'px)';
  });
  requestAnimationFrame(updateMarquees);
}

// iOS: Web Audio sale por el canal del timbre y el interruptor de silencio del
// iPhone lo mutea por completo, aunque el AudioContext diga 'running' — por eso
// el aviso podia decir que todo estaba bien y no se escuchaba nada. En iOS 17+
// se mueve al canal de medios con navigator.audioSession.type = 'playback'.
// Debe llamarse DENTRO del gesto del usuario (toque/clic), de forma sincrona.
function setPlaybackSession() {
  try {
    if (navigator.audioSession) {
      navigator.audioSession.type = 'playback';
    }
  } catch (e) {}
}

// Desbloqueo de audio: tiene que correrse DENTRO de un toque o clic del usuario.
// Es sincrono (sin esperas) y se puede llamar en cada toque: si ya esta desbloqueado no hace nada.
function unlockAudio() {
  setPlaybackSession();
  try {
    if (!audioContext) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioContext.state === 'suspended') {
      audioContext.resume().then(() => {
        if (audioContext.state === 'running') {
          audioInitialized = true;
          audioUnlocked = true;
        }
      }).catch(() => {});
    } else if (audioContext.state === 'running') {
      audioInitialized = true;
      audioUnlocked = true;
    }
    // Buffer silencioso: en iOS ayuda a desbloquear el contexto
    const buffer = audioContext.createBuffer(1, 1, audioContext.sampleRate);
    const source = audioContext.createBufferSource();
    source.buffer = buffer;
    source.connect(audioContext.destination);
    source.start(0);
  } catch (e) {
    console.log('Error al desbloquear audio:', e);
  }
}

// Función de sonidos optimizada. `vol` opcional: si no se pasa, usa el volumen
// base (movil 0.15, escritorio 0.03). El bip de tecleo era casi inaudible en

function playBeep(frequency = 800, duration = 100, vol) {
  if (!soundEnabled || !audioContext) {
    return;
  }
  const playNow = () => {
    try {
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);

      oscillator.type = 'sine';
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      gainNode.gain.value = (typeof vol === 'number') ? vol : (isMobile ? 0.15 : 0.03);
      const now = audioContext.currentTime;
      oscillator.start(now);
      oscillator.stop(now + duration / 1000);

    }

  if (audioContext.state === 'suspended') {
    // Antes se llamaba resume() y se regresaba sin sonar: el bip se perdia.
    // Ahora se reanuda y se toca el bip cuando el contexto ya esta corriendo.
    audioContext.resume().then(playNow).catch(() => {});
    return;
  }
  if (audioContext.state !== 'running') {
    return;
  }
  playNow();
}

function playKeyboardSound() {
  if (!soundEnabled) return;
  const frequencies = [400, 450, 500, 550, 600];
  const freq = frequencies[Math.floor(Math.random() * frequencies.length)];
  playBeep(freq, 50);
}

function playLogoBeep() {
  if (!soundEnabled) return;
  playBeep(800, 150);
  setTimeout(() => playBeep(600, 100), 80);
}

function applyGlitchEffect(container) {
  container.classList.add('glitch-effect');
  setTimeout(() => {
    container.classList.remove('glitch-effect');
  }, 300);
}

function updateCursorColor(section) {
  const cursor = document.getElementById('cursor');
  cursor.className = 'cursor';
  if (section === 'branding') cursor.classList.add('cursor-section-1');
  else if (section === 'contact') cursor.classList.add('cursor-section-2');
  else if (section === 'logos') cursor.classList.add('cursor-section-3');
}

// Función principal de escritura
function typeWriter(text, container, speed = 84) {
  let i = 0;
  let inColorSection = false;
  let inLogoSection = false;
  let currentSection = 'branding';
  isTyping = true;
  const run = ++typingRun;

  function type() {
    if (run !== typingRun) return;
    if (i < text.length) {
      let char = text.charAt(i);
      let nextChars = text.substr(i);

      // Actualizar sección para cursor
      if (nextChars.startsWith('"CONTACTO"')) {
        currentSection = 'contact';
        updateCursorColor(currentSection);
      }
      if (nextChars.startsWith('"LOGOS"')) {
        currentSection = 'logos';
        updateCursorColor(currentSection);
      }

      // Detectar sección de colores
      if (nextChars.startsWith('"KELLER_PALLETS"')) {
        inColorSection = true;
        container.innerHTML += '<div class="color-section scan-effect"><div class="tube-marquee"><span data-times="3">' + repeatMarqueeText('Capturando México ▲ | Tiempo, escenarios ǝ instantes', 3) + '</span></div>';
      }

      // Detectar sección de logos
      if (nextChars.startsWith('"LOGOS"')) {
        inLogoSection = true;
        container.innerHTML += '<div class="logo-section scan-effect"><div class="tube-marquee"><span data-times="5">' + repeatMarqueeText('www.Kelleretoro.com', 5, ' \u25b2 ') + '</span></div>';
      }

      // Efectos sutiles
      if (Math.random() < 0.02 && char !== ' ') {
        applyGlitchEffect(container);
      }
      if (char !== ' ' && char !== '\n') {
        playKeyboardSound();
      }

      // Detectar emojis
      if (/[\u{1F300}-\u{1F9FF}]|[\u{2600}-\u{26FF}]|[\u{1F600}-\u{1F64F}]|[\u{1F680}-\u{1F6FF}]|[\u{1F1E0}-\u{1F1FF}]/u.test(char)) {
        container.innerHTML += `<span class="highlight-emoji breathing-text">${char}</span>`;
        i++;
      }
      // Detectar comentarios
      else if (nextChars.match(/^\/\/.*$/m)) {
        let match = nextChars.match(/^\/\/.*$/m)[0];
        container.innerHTML += `<span class="highlight-comment">${match}</span>`;
        i += match.length;
      }
      // Detectar colores hex
      else if (char === '#' && nextChars.match(/^#[0-9a-fA-F]{6}/)) {
        let colorCode = nextChars.match(/^#[0-9a-fA-F]{6}/)[0];
        let colorPreview = `<span class="color-preview" style="background-color:${colorCode};"></span>`;
        container.innerHTML += `<span class="highlight-hash" style="background: ${colorCode}20; padding: 2px 4px; border-radius: 3px;">${colorCode}</span>${colorPreview}`;
        i += 7;
      }
      // Detectar URLs de imágenes
      else if (nextChars.match(/^"[^"]*https:\/\/[^"]*\.(png|jpg|jpeg|gif)[^"]*"/)) {
        let match = nextChars.match(/^"[^"]*"/)[0];
        let imageUrl = match.slice(1, -1);
        let logoClass = "logo-preview";
        if (imageUrl.includes('logo.png')) {
          logoClass += " logo-square";
        } else if (imageUrl.includes('letrero.jpg')) {
          logoClass += " logo-rectangular";
        }
        container.innerHTML += `<span class="highlight-string">${match}</span><br><img src="${imageUrl}" class="${logoClass}" alt="Keller Logo" onerror="this.style.display='none'">`;
        playLogoBeep();
        i += match.length;
      }
      // Detectar strings
      else if (nextChars.match(/^"[^"]*"/)) {
        let match = nextChars.match(/^"[^"]*"/)[0];
        if (nextChars.includes('KELLER_SLOGAN')) {
          container.innerHTML += `<span class="highlight-string breathing-text">${match}</span>`;
        } else {
          container.innerHTML += `<span class="highlight-string">${match}</span>`;
        }
        i += match.length;
      }
      // Detectar keys
      else if (nextChars.match(/^"[^"]*":/)) {
        let match = nextChars.match(/^"[^"]*"/)[0];
        container.innerHTML += `<span class="highlight-key">${match}</span>`;
        i += match.length;
      }
      // Cerrar secciones
      else if (char === ']' && (inColorSection || inLogoSection)) {
        container.innerHTML += char;
        if (inColorSection || inLogoSection) {
          container.innerHTML += '</div>';
          inColorSection = false;
          inLogoSection = false;
        }
        i++;
      } else {
        container.innerHTML += char;
        i++;
      }

      // Velocidad
      let nextSpeed = currentSpeed;
      if (/[\u{1F300}-\u{1F9FF}]|[\u{2600}-\u{26FF}]|[\u{1F600}-\u{1F64F}]|[\u{1F680}-\u{1F6FF}]|[\u{1F1E0}-\u{1F1FF}]/u.test(char)) {
        nextSpeed = currentSpeed * 2;
      } else if (char === '#') {
        nextSpeed = currentSpeed * 2;
      }
      setTimeout(type, Math.max(20, nextSpeed));
    } else {
      isTyping = false;
      // Mensaje final. Se construye con DOM (createElement/appendChild), no con
      // varios innerHTML +=, porque el navegador auto-cierra un div que se abre
      // en un innerHTML y se cierra en otro: por eso el cintillo quedaba fuera
      // del tubo, debajo de él, y el tubo se veía vacío.
      setTimeout(() => {
        if (run !== typingRun) return;
        // El tubo va FUERA de la sección Branding, arriba de ella (a Oscar le
        // gusta más así); el texto sí va DENTRO del tubo.
        const tubeDiv = document.createElement('div');
        tubeDiv.className = 'tube-marquee';
        tubeDiv.innerHTML = '<span data-times="3">' + repeatMarqueeText('Instagram @kelleretoro • Facebook kelleretoroph', 3, ' | ') + '</span>';
        const finalDiv = document.createElement('div');
        finalDiv.className = 'scan-effect';
        finalDiv.style.cssText = 'text-align: center; margin-top: 30px; padding: 20px; background: rgba(1, 248, 254, 0.1); border-radius: 8px;';
        finalDiv.innerHTML = '<div><span style="color: #01f8fe; font-weight: bold; font-size: 1.2em;" class="breathing-text">Branding | by kellerEToro</span></div>';
        container.appendChild(document.createTextNode('\n\n'));
        container.appendChild(tubeDiv);
        container.appendChild(finalDiv);
        setTimeout(() => {
          if (run !== typingRun) return;
          const colors = ['#8dffe9', '#4bfbd6', '#283431', '#01f8fe', '#2a302b'];
          let swatches = '';
          colors.forEach(color => {
            swatches += `<span class="color-preview" style="background-color: ${color}; width: 30px; height: 30px; margin: 5px;"></span>`;
          });
          const paletaDiv = document.createElement('div');
          paletaDiv.style.marginTop = '15px';
          paletaDiv.innerHTML = '<span style="color: #8dffe9;">Paleta completa:</span><br>' + swatches;
          finalDiv.appendChild(paletaDiv);
          playBeep(500, 200);
          setTimeout(() => playBeep(400, 150), 150);
          setTimeout(() => playBeep(300, 200), 300);
        }, 1200);
      }, 1000);
    }
  }
  type();
}

// Funciones de control
function toggleControls() {
  const controls = document.getElementById('controls');
  const toggleBtn = document.getElementById('controlsToggle');
  if (controls.classList.contains('show')) {
    controls.classList.remove('show');
    toggleBtn.textContent = '⚡ Controles';
  } else {
    controls.classList.add('show');
    toggleBtn.textContent = '✖️ Cerrar';
    playBeep(600, 80);
  }
}

function restartAnimation() {
  const container = document.getElementById('typing-container');
  const cursorEl = document.getElementById('cursor');
  if (!container) return;
  typingRun++;
  isTyping = false;
  container.innerHTML = '';
  if (cursorEl) cursorEl.style.display = 'inline-block';
  setTimeout(() => {
    if (isTyping) return;
    typeWriter(jsonContent, container, currentSpeed);
  }, 500);
}

function stopAudio() {
  // Sin acción: playBeep ya no suena cuando soundEnabled es false.
}

function showAudioResult() {
  const result = document.createElement('div');
  result.style.cssText = `
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(75, 251, 214, 0.9);
    color: #283431;
    padding: 12px 20px;
    border-radius: 25px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85em;
    z-index: 9999;
    text-align: center;
    max-width: 280px;
    animation: fadeInOut 4s ease-in-out;
  `;
  // OJO: esto solo confirma que los tonos se enviaron, no que se escucharon.
  // En iPhone no hay forma de detectar si el interruptor de silencio los muto,
  // por eso el aviso dice que revisar si no se oye nada, en vez de asegurar
  // que "todo funciona".
  result.innerHTML = '<div>🔊 Tonos de prueba enviados — si no los escuchaste, revisa el interruptor de silencio (debe estar en sonido) y sube el volumen</div>';
  document.body.appendChild(result);
  setTimeout(() => {
    if (result.parentNode) result.parentNode.removeChild(result);
  }, 4000);
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  const soundBtn = document.getElementById('soundBtn');
  if (soundBtn) {
    soundBtn.textContent = soundEnabled ? '🔊 Sonido: ON' : '🔇 Sonido: OFF';
  }
  if (!soundEnabled) stopAudio();
  if (soundEnabled) {
    unlockAudio();
    setTimeout(() => playBeep(880, 100), 150);
  }
  console.log('🔊 Sonido:', soundEnabled ? 'ON' : 'OFF');
}

function testAudio() {
  if (!soundEnabled) {
    alert('🔇 El sonido está apagado. Actívalo primero.');
    return;
  }
  unlockAudio();
  setTimeout(() => {
    if (audioContext && audioContext.state === 'running') {
      // Tonos de prueba fuertes y largos, para que si suenan se noten sin duda.
      playBeep(880, 300, 0.2);
      setTimeout(() => playBeep(1108, 300, 0.2), 350);
      setTimeout(() => playBeep(1318, 400, 0.2), 700);
      showAudioResult();
    } else {
      showAudioFail();
    }
  }, 300);
}

function showAudioFail() {
  const result = document.createElement('div');
  result.style.cssText = `
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 107, 107, 0.9);
    color: #283431;
    padding: 12px 20px;
    border-radius: 25px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85em;
    z-index: 9999;
    text-align: center;
    max-width: 280px;
    animation: fadeInOut 4s ease-in-out;
  `;
  result.innerHTML = '<div>🔇 Aún no suena — toca la pantalla y prueba de nuevo</div>';
  document.body.appendChild(result);
  setTimeout(() => {
    if (result.parentNode) result.parentNode.removeChild(result);
  }, 4000);
}

function updateSpeed() {
  const slider = document.getElementById('speedSlider');
  const display = document.getElementById('speedDisplay');
  currentSpeed = parseInt(slider.value) * 2;
  display.textContent = slider.value + 'ms';
}

function animateVisitCounter() {
  const counter = document.getElementById('visitCount');
  if (!counter) return;
  // Contador global (countapi): suma 1 en el servidor y devuelve el total acumulado,
  // para que el conteo no se reinicie y sea el mismo para todos los visitantes.
  // Si el servicio no responde, usa el conteo local como respaldo.
  fetch('https://countapi.mileshilliard.com/api/v1/hit/kelleretoro-lensman-visits')
    .then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function(data) {
      const total = (data && typeof data.value === 'number') ? data.value : null;
      if (total === null) throw new Error('sin valor');
      animateCount(counter, total);
    })
    .catch(function() {
      visitCount++;
      localStorage.setItem('kellerVisitCount', visitCount);
      animateCount(counter, visitCount);
    });
}

function animateCount(counter, target) {
  let current = 0;
  const step = Math.max(1, Math.ceil(target / 40));
  const tick = function() {
    current += step;
    if (current >= target) {
      counter.textContent = target;
    } else {
      counter.textContent = current;
      setTimeout(tick, 25);
    }
  };
  tick();
}

// Inicialización
document.addEventListener('DOMContentLoaded', function() {
  const container = document.getElementById('typing-container');
  animateVisitCounter();
  const isMobile = /Mobi|Android/i.test(navigator.userAgent);
  if (isMobile) {
    console.log('📱 Dispositivo móvil detectado - iniciando sistema híbrido...');
    initializeMobileAudio();
    currentSpeed = Math.max(100, currentSpeed);
    document.getElementById('speedSlider').value = currentSpeed / 2;
    document.getElementById('speedDisplay').textContent = (currentSpeed / 2) + 'ms';
  } else {
    console.log('💻 Desktop detectado...');
    document.addEventListener('click', initializeAudio, { once: true });
  }
  container.innerHTML = '<span style="color: #8dffe9; font-style: italic;">Inicializando branding futurista...</span>';
  updateCursorColor('branding');
  setTimeout(() => {
    container.innerHTML = '';
    typeWriter(jsonContent, container, currentSpeed);
  }, 1500);
});
